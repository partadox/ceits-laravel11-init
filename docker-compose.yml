version: '3.8'

services:
  prisma-laravel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prisma-laravel
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - ceits-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health", "||", "exit", "1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  ceits-network:
    driver: bridge
